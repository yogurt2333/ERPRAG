# Replace ERP_HOST with the chosen hostname. Keep existing sites unchanged.
server {
    listen 80;
    server_name ERP_HOST;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/lean-erp-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://ERP_HOST$request_uri; }
}
